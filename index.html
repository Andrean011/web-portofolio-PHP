<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Group 11 PHP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="./img/fotoprofil/PHP.jpeg?v=2">
    <link rel="shortcut icon" type="image/jpeg" href="./img/fotoprofil/PHP.jpeg?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>

    <!-- Floating Top-Right Controls -->
    <aside class="floating-controls" id="floating-controls" aria-label="Pengaturan tampilan dan bahasa">
        <div class="lang-switch" role="group" aria-label="Pilih Bahasa / Select Language">
            <button type="button" class="lang-btn active" data-lang="id" id="lang-btn-id" aria-pressed="true" title="Bahasa Indonesia">ID</button>
            <button type="button" class="lang-btn" data-lang="en" id="lang-btn-en" aria-pressed="false" title="English">EN</button>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Beralih ke mode terang" title="Beralih ke mode terang">
            <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </aside>

    <header>
        <div class="header-glow" aria-hidden="true"></div>
        <div class="header-particles" aria-hidden="true">
            <span>&lt;/&gt;</span>
            <span>{ }</span>
            <span>$</span>
            <span>;</span>
            <span>#</span>
            <span>=&gt;</span>
        </div>
        <div class="traffic-lights" aria-hidden="true">
            <span class="traffic-light red"></span>
            <span class="traffic-light yellow"></span>
            <span class="traffic-light green"></span>
        </div>
        <div class="header-content">
            <h1 class="header-title"><span>Portofolio Group 11 PHP</span></h1>
            <p id="header-subtitle">Berkomitmen untuk terus belajar dan menaklukkan tantangan berat.</p>
            <div class="header-meta" id="header-meta" aria-label="Ringkasan tim">
                <span><strong>09</strong> <span id="meta-member-text">Anggota</span></span>
                <span><strong>PHP</strong> <span id="meta-group-text">Grup</span></span>
            </div>
        </div>
        <div class="header-scanline" aria-hidden="true"></div>
    </header>
    <main id="member-grid" class="grid-container"></main>
    <div id="modal-root"></div>
    <script src="script.js"></script>
</body>
</html>
